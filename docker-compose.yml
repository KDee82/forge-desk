name: forge-desk

services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - desk

  # The whole workspace: web desktop server, terminals, code-server, Linux desktop, browser.
  desk:
    build:
      context: .
      dockerfile: workspace-image/Dockerfile
    restart: unless-stopped
    environment:
      FORGE_PASSWORD_HASH: ${FORGE_PASSWORD_HASH}
      TZ: ${TZ}
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    volumes:
      - ./workspace:/home/coder/project
      - ide_config:/home/coder/.config
      - ide_local:/home/coder/.local
      # The interface is served live from this folder: edit it and reload, no rebuild.
      - ./dashboard:/opt/forge-desk/dashboard:ro
    # Deliberately no published ports: the only way in is through the gateway.

volumes:
  caddy_data:
  caddy_config:
  ide_config:
  ide_local:
