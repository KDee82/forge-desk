; Forge Desk process list. Check on things from the terminal with:
;   supervisorctl status          supervisorctl restart desktop
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/forge-supervisord.pid

[unix_http_server]
file=/tmp/forge-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/forge-supervisor.sock

; The web desktop: login, terminals, files, and the bridges to everything below.
[program:desk]
command=node /opt/forge-desk/server/server.js
environment=PORT="7700",IDE_PORT="7701",VNC_PORT="5901",PUBLIC_DIR="/opt/forge-desk/dashboard"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; code-server, reachable only through the Forge Desk login (at /ide/).
[program:code]
command=code-server --bind-addr 127.0.0.1:7701 --auth none --disable-telemetry --disable-update-check --abs-proxy-base-path=/ide /home/coder/project
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The X display plus its VNC server. It listens on localhost only and has no
; password of its own: the Forge Desk login is the only way in.
[program:display]
command=Xtigervnc :1 -geometry 1440x900 -depth 24 -rfbport 5901 -localhost -SecurityTypes None -AlwaysShared -desktop ForgeDesk
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The XFCE desktop session on that display.
[program:desktop]
command=/usr/local/bin/forge-desktop-session
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/null
redirect_stderr=true
