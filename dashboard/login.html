<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in to Forge Desk</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; display: grid; place-items: center; padding: 24px; color: #e8eaf0;
        font-family: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background:
          radial-gradient(90vmax 60vmax at 8% 112%, #c9a96e40 0, #8a6a3020 34%, transparent 62%),
          radial-gradient(70vmax 55vmax at 100% -10%, #1a8fff50 0, transparent 60%),
          #0b0f1a;
      }
      main { width: min(380px, 100%); }
      .mark { width: 52px; height: 52px; border-radius: 15px; display: block; margin-bottom: 28px; box-shadow: 0 18px 40px -14px #1a8fffaa; }
      h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 700; margin: 0 0 8px; }
      p { margin: 0 0 28px; color: #9ba8be; font-size: 15px; line-height: 1.55; }
      label { display: block; font-size: 13px; font-weight: 600; color: #b0bdd0; margin-bottom: 8px; }
      input {
        width: 100%; height: 50px; padding: 0 16px; font: inherit; font-size: 16px; color: inherit;
        background: #111827d9; border: 1px solid #1e2d44; border-radius: 12px; outline: none;
      }
      input:focus-visible { border-color: #1a8fff; box-shadow: 0 0 0 3px #1a8fff40; }
      button {
        width: 100%; height: 50px; margin-top: 14px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
        color: #0b0f1a; background: #e8eaf0; border: 0; border-radius: 12px;
      }
      button:hover { background: #fff; }
      button:focus-visible { outline: 3px solid #1a8fff; outline-offset: 2px; }
      button[disabled] { opacity: 0.6; cursor: progress; }
      .error { min-height: 22px; margin: 12px 0 0; color: #ff9c9c; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/favicon.svg" alt="" />
      <h1>Forge Desk</h1>
      <p>A DML AI Product — Your server's desktop, terminal and files.</p>
      <form id="form" autocomplete="on">
        <input type="text" name="username" value="forge" autocomplete="username" hidden />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button id="submit" type="submit">Sign in</button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
