<!doctype html>
<html lang="en" data-theme="dark" data-wall="forge">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Forge Desk</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" />
    <script src="/boot.js"></script>
    <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="bar" id="bar">
      <button class="bar-brand" id="brand" type="button" aria-label="Show the desktop">
        <img src="/favicon.svg" alt="" /><span>Forge Desk</span>
      </button>
      <button class="bar-search" id="search" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></svg>
        <span>Search apps and actions</span><kbd id="search-kbd">Ctrl K</kbd>
      </button>
      <div class="bar-right">
        <button class="bar-stat" id="stats" type="button" title="Open system settings" hidden>
          <span><i>CPU</i><b id="stat-cpu">–</b></span><span><i>Memory</i><b id="stat-mem">–</b></span>
        </button>
        <span class="bar-status" id="status" data-state="checking" role="status"><i aria-hidden="true"></i><b id="status-text">Connecting</b></span>
        <time class="bar-clock" id="clock"></time>
      </div>
    </header>

    <main class="stage" id="stage">
      <section class="home" id="home" aria-label="Desktop">
        <h1 id="greeting">Good day.</h1>
        <p class="home-date" id="today"></p>
        <div class="home-running" id="home-running"></div>
      </section>
    </main>

    <nav class="dock" id="dock" aria-label="Apps"></nav>

    <div class="layer" id="layer"></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <noscript><p style="padding:24px;color:#fff">Forge Desk needs JavaScript.</p></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
